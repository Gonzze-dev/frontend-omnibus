<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ya llegó</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ya llegó te avisa cuando tu colectivo llega a la terminal y en qué andén. Ingresá el código de tu pasaje o escaneá el QR y esperá tranquilo.">
  <meta name="theme-color" content="#002C98">
  <!-- Link previews (WhatsApp, social networks): their crawlers do not run JS,
       so these tags must be static. og:image needs an absolute URL. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ya llegó">
  <meta property="og:locale" content="es_AR">
  <meta property="og:title" content="Ya llegó">
  <meta property="og:description" content="Te avisamos cuando llega tu colectivo y en qué andén.">
  <meta property="og:image" content="https://frontend-omnibus-production.up.railway.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo de Ya llegó: un colectivo dentro de un pin de ubicación.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
  <!-- defer: it does not block the first paint and still runs before the app
       bundle (deferred and module scripts run in document order). -->
  <script src="env.js" defer></script>
  <!-- Login splash (login.scss): decided here, before the first paint, so the
       prerendered login does not start the animation and cut it once the app
       boots. It plays on a fresh load of the entry screen at most once every
       24 h; if storage is blocked it plays every time. -->
  <script>
    (function () {
      if (!/^\/(login\/?)?$/.test(location.pathname)) return;
      var key = 'login_intro_until', now = Date.now();
      try {
        if (Number(localStorage.getItem(key)) > now) return;
        localStorage.setItem(key, String(now + 24 * 60 * 60 * 1000));
      } catch (e) {}
      document.documentElement.classList.add('login-intro');
    })();
  </script>
  <!-- Self-hosted fonts (latin subset of the Google Fonts variable files, OFL):
       no extra origin to connect to. Inter and Manrope are on the entry screens,
       so they are preloaded; Hanken Grotesk is only used in the admin panel. -->
  <link rel="preload" href="fonts/inter-v20-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-v20-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url(fonts/inter-v20-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Manrope';
      font-style: normal;
      font-weight: 700 800;
      font-display: swap;
      src: url(fonts/manrope-v20-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Hanken Grotesk';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url(fonts/hanken-grotesk-v12-latin.woff2) format('woff2');
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
