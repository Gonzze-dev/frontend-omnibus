<div class="ab-screen forgot">
  <header class="forgot__head">
    <h1 class="ab-brand">¿Olvidaste tu contraseña?</h1>
    <p class="ab-subtitle forgot__lead">
      Ingresá tu email y te llegará un correo para cambiar tu contraseña
    </p>
  </header>

  <form class="forgot__form" [formGroup]="form" (ngSubmit)="sendLink()" novalidate>
    <div class="ab-field">
      <label class="ab-label" for="email">Email</label>
      <input class="ab-input" id="email" type="email" placeholder="nombre@ejemplo.com" autocomplete="email"
             formControlName="email" [attr.aria-invalid]="invalid()" />
      @if (invalid()) {
        <p class="ab-field-error">Ingresá un email válido.</p>
      }
    </div>

    @if (error()) {
      <p class="ab-form-error" role="alert">{{ error() }}</p>
    }

    @if (showToast()) {
      <app-toast animate.leave="ab-leave-up" [message]="sent()!" (closed)="showToast.set(false)" />
    }

    <button class="ab-button" type="submit" [disabled]="loading() || !!sent()">
      {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
    </button>
  </form>

  <p class="ab-footnote forgot__foot">
    ¿Recordaste tu contraseña?
    <a class="ab-link" routerLink="/login">Iniciá sesión</a>
  </p>
</div>
