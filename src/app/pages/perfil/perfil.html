<app-topbar />

<div class="ab-screen perfil">
  <header class="perfil__head">
    <h1 class="ab-brand perfil__titulo">Informacion sobre tu perfil</h1>
    <p class="perfil__bajada">
      Actualiza tus datos personales y tu información de contacto.
    </p>
  </header>

  <form class="perfil__form">
    <div class="ab-field">
      <label class="ab-label" for="nombre">Nombre completo</label>
      <input
        class="ab-input"
        id="nombre"
        type="text"
        [value]="perfil.nombre"
        autocomplete="name"
      />
    </div>

    <div class="ab-field">
      <label class="ab-label" for="email">Email</label>
      <input
        class="ab-input"
        id="email"
        type="email"
        [value]="perfil.email"
        autocomplete="email"
      />
    </div>

    <div class="ab-field">
      <label class="ab-label" for="password">Contraseña</label>
      <div class="ab-password">
        <input
          class="ab-input"
          id="password"
          [type]="mostrarPassword() ? 'text' : 'password'"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        <app-password-toggle [visible]="mostrarPassword()" (visibleChange)="mostrarPassword.set($event)" />
      </div>
    </div>

    <div class="ab-field">
      <label class="ab-label" for="confirmar">Confirmar contraseña</label>
      <div class="ab-password">
        <input
          class="ab-input"
          id="confirmar"
          [type]="mostrarConfirmar() ? 'text' : 'password'"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        <app-password-toggle [visible]="mostrarConfirmar()" (visibleChange)="mostrarConfirmar.set($event)" />
      </div>
    </div>

    <button class="ab-button ab-button--lg perfil__guardar" type="button">
      Guardar cambios
    </button>
  </form>

  <button class="perfil__eliminar" type="button">Eliminar cuenta</button>
</div>
