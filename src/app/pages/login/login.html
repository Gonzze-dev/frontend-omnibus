<div class="ab-screen login">
  <h1 class="ab-brand login__brand">Alerta Bus</h1>

  <section class="login__card">
    <header class="login__head">
      <h2 class="ab-title">Iniciar Sesion</h2>
      <p class="ab-subtitle">Ingresa tus credenciales para continuar</p>
    </header>

    <form class="login__form" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div class="ab-field">
        <label class="ab-label" for="email">Email</label>
        <input class="ab-input" id="email" type="email" placeholder="name@company.com" autocomplete="email"
               formControlName="email" [attr.aria-invalid]="invalido('email')" />
        @if (invalido('email')) {
          <p class="ab-field-error">Ingresa un email valido.</p>
        }
      </div>

      <div class="ab-field">
        <div class="ab-label-row">
          <label class="ab-label" for="password">Contraseña</label>
          <a class="ab-link login__forgot" routerLink="/olvidar-contrasena">Olvidaste tu contraseña?</a>
        </div>
        <input class="ab-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password"
               formControlName="password" [attr.aria-invalid]="invalido('password')" />
        @if (invalido('password')) {
          <p class="ab-field-error">Ingresa tu contraseña.</p>
        }
      </div>

      @if (error()) {
        <p class="ab-form-error" role="alert">{{ error() }}</p>
      }

      <button class="ab-button" type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
        <svg class="ab-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M1 8h13m0 0-5-5m5 5-5 5" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </form>

    <footer class="login__foot">
      <p class="ab-footnote">
        No tienes cuenta?
        <a class="ab-link" routerLink="/registro">Registrate</a>
      </p>
    </footer>
  </section>
</div>
