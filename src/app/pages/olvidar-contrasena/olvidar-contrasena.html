<div class="ab-screen olvidar">
  <header class="olvidar__head">
    <h1 class="ab-brand">Olvidaste tu contraseña?</h1>
    <p class="ab-subtitle olvidar__lead">
      Ingresa tu email y te llegara un correo para cambiar tu contraseñá
    </p>
  </header>

  <form class="olvidar__form" [formGroup]="form" (ngSubmit)="enviarEnlace()" novalidate>
    <div class="ab-field">
      <label class="ab-label" for="email">Email</label>
      <input class="ab-input" id="email" type="email" placeholder="name@company.com" autocomplete="email"
             formControlName="email" [attr.aria-invalid]="invalido()" />
      @if (invalido()) {
        <p class="ab-field-error">Ingresa un email valido.</p>
      }
    </div>

    @if (error()) {
      <p class="ab-form-error" role="alert">{{ error() }}</p>
    }

    @if (enviado()) {
      <p class="ab-form-ok" role="status">{{ enviado() }}</p>
    }

    <button class="ab-button" type="submit" [disabled]="cargando() || !!enviado()">
      {{ cargando() ? 'Enviando...' : 'Enviar enlace' }}
    </button>
  </form>

  <p class="ab-footnote olvidar__foot">
    Recordaste tu contraseña?
    <a class="ab-link" routerLink="/login">Inicia Sesión</a>
  </p>
</div>
