<div class="search">
  <input #field class="search__input" type="text" role="combobox" autocomplete="off" aria-autocomplete="list"
         [id]="inputId()" [placeholder]="placeholder()" [value]="text()" [disabled]="disabled()"
         [attr.aria-describedby]="describedBy() || null"
         [attr.aria-expanded]="open()" [attr.aria-controls]="listId"
         [attr.aria-activedescendant]="open() && active() >= 0 ? listId + '-' + active() : null"
         [attr.aria-invalid]="invalid()"
         (focus)="openList()" (click)="openList()"
         (input)="type($any($event.target).value)"
         (keydown)="onKeydown($event)" />

  <svg class="search__arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
    <path d="M1 1.5 6 6.5l5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </svg>

  @if (open()) {
    <!-- tabindex="-1": a scrollable list is a Tab stop in Chrome; Tab must go
         from the input to the next field (options are reached with the arrows). -->
    <ul #list class="search__list" role="listbox" popover="manual" [id]="listId" tabindex="-1">
      @for (o of filtered(); track o.value; let i = $index) {
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
        <li class="search__option" role="option" [id]="listId + '-' + i"
            [class.search__option--active]="i === active()"
            [class.search__option--selected]="o.value === value()"
            [attr.aria-selected]="o.value === value()"
            [attr.aria-disabled]="o.disabled || null"
            (mousedown)="$event.preventDefault()"
            (mouseenter)="!o.disabled && active.set(i)"
            (click)="choose(o)">
          <span class="search__label">{{ o.label }}</span>
          @if (o.detail) {
            <span class="search__detail">{{ o.detail }}</span>
          }
        </li>
      } @empty {
        <li class="search__empty">Sin coincidencias.</li>
      }
    </ul>
  }
</div>
