<button
  type="button"
  class="ab-password__toggle"
  (click)="alternar()"
  [attr.aria-label]="visible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
  [attr.aria-pressed]="visible"
>
  @if (visible) {
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M2 12s3.6-7 10-7c1.9 0 3.5.5 4.9 1.2M22 12s-3.6 7-10 7c-1.9 0-3.5-.5-4.9-1.2"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M9.5 9.6a3 3 0 0 0 4.2 4.2M6.1 6.1 2 2m20 20-4.1-4.1"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
</button>
