<!-- The drawer only exists on phones: from 768px the links go in the bar. -->
<app-sidebar class="topbar__drawer" [(open)]="menuOpen" />

<header class="topbar">
  <button
    class="topbar__menu"
    type="button"
    aria-label="Abrir menú"
    aria-controls="main-menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(true)"
  >
    <svg class="ab-icon" width="18" height="12" viewBox="0 0 18 12" fill="none" aria-hidden="true">
      <path d="M0 1h18M0 6h18M0 11h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <nav class="topbar__nav" aria-label="Menú principal">
    <a class="topbar__link" routerLink="/home" routerLinkActive="topbar__link--active">Inicio</a>
    <a class="topbar__link" routerLink="/profile" routerLinkActive="topbar__link--active">Ver perfil</a>
    <!-- Administrators only: the route is also protected by rolesOnly. -->
    @if (isAdmin()) {
      <a class="topbar__link" routerLink="/dashboard" routerLinkActive="topbar__link--active">Dashboard</a>
    }
  </nav>

  <div class="topbar__actions">
    <a class="topbar__bell" routerLink="/notifications" aria-label="Ver notificaciones">
      <svg class="ab-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 2a5 5 0 0 0-5 5v3l-1.5 3h13L15 10V7a5 5 0 0 0-5-5Z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M8 16a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      @if (pending() > 0) {
        <span class="topbar__badge">{{ pending() }}</span>
      }
    </a>

    <button class="topbar__logout" type="button" (click)="logout()">Cerrar sesión</button>
  </div>
</header>
