<app-sidebar [(open)]="menuOpen" />

<header class="topbar">
  <button
    class="topbar__menu"
    type="button"
    aria-label="Abrir menu"
    aria-controls="menu-principal"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(true)"
  >
    <svg class="ab-icon" width="18" height="12" viewBox="0 0 18 12" fill="none" aria-hidden="true">
      <path d="M0 1h18M0 6h18M0 11h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <a class="topbar__bell" routerLink="/notificaciones" aria-label="Ver notificaciones">
    <svg class="ab-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 2a5 5 0 0 0-5 5v3l-1.5 3h13L15 10V7a5 5 0 0 0-5-5Z"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      <path d="M8 16a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    @if (pendientes() > 0) {
      <span class="topbar__badge">{{ pendientes() }}</span>
    }
  </a>
</header>
