<div class="scanner__backdrop" (click)="cerrarModal()">
  <div class="scanner__panel" (click)="$event.stopPropagation()">
    <button class="scanner__close" type="button" (click)="cerrarModal()" aria-label="Cerrar camara">
      <svg class="ab-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M1 1l16 16M17 1L1 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <h2 class="scanner__title">Escanear QR</h2>

    @if (error()) {
      <p class="scanner__error">{{ error() }}</p>
    } @else {
      <div class="scanner__video-wrap">
        <video
          #video
          class="scanner__video"
          [class.scanner__video--espejo]="espejo()"
          muted
          playsinline
        ></video>
        <div class="scanner__frame" aria-hidden="true"></div>
        @if (cargando()) {
          <p class="scanner__hint">Iniciando camara...</p>
        }
      </div>
      <p class="scanner__hint">Apunta la camara al codigo QR del pasaje.</p>
    }

    <canvas #canvas class="scanner__canvas"></canvas>
  </div>
</div>
