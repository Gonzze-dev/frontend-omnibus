<!-- Clicking the backdrop is a mouse shortcut: the keyboard closes with Escape or the close button. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div class="scanner__backdrop" (click)="closeModal()">
  <!-- cdkTrapFocus: Tab stays inside the modal (WCAG 2.4.3) -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
  <div class="scanner__panel" role="dialog" aria-modal="true" aria-labelledby="scanner-title" cdkTrapFocus
       (click)="$event.stopPropagation()">
    <button #closeButton class="scanner__close" type="button" (click)="closeModal()" aria-label="Cerrar cámara">
      <svg class="ab-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M1 1l16 16M17 1L1 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <h2 class="scanner__title" id="scanner-title">Escanear QR</h2>

    @if (error()) {
      <p class="scanner__error" role="alert">{{ error() }}</p>
    } @else {
      <div class="scanner__video-wrap">
        <video
          #video
          class="scanner__video"
          [class.scanner__video--mirror]="mirror()"
          muted
          playsinline
        ></video>
        <div class="scanner__frame" aria-hidden="true"></div>
        @if (loading()) {
          <p class="scanner__hint" role="status">Iniciando cámara...</p>
        }
        @if (read()) {
          <div class="scanner__read" role="status" aria-label="Código leído">
            <svg width="28" height="22" viewBox="0 0 20 16" fill="none" aria-hidden="true">
              <path
                d="M8.45 11.5C8.86667 11.9167 9.39167 12.1125 10.025 12.0875C10.6583 12.0625 11.1167 11.8333 11.4 11.4L17 3L8.6 8.6C8.16667 8.9 7.92917 9.35417 7.8875 9.9625C7.84583 10.5708 8.03333 11.0833 8.45 11.5ZM3.1 16C2.73333 16 2.39583 15.9208 2.0875 15.7625C1.77917 15.6042 1.53333 15.3667 1.35 15.05C0.916667 14.2667 0.583333 13.4542 0.35 12.6125C0.116667 11.7708 0 10.9 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3667 0 12.65 0.258333 13.85 0.775C15.05 1.29167 16.1 1.99583 17 2.8875C17.9 3.77917 18.6167 4.82083 19.15 6.0125C19.6833 7.20417 19.9583 8.48333 19.975 9.85C19.9917 10.7667 19.8875 11.6625 19.6625 12.5375C19.4375 13.4125 19.0917 14.25 18.625 15.05C18.4417 15.3667 18.1958 15.6042 17.8875 15.7625C17.5792 15.9208 17.2417 16 16.875 16H3.1Z"
                fill="white"
              />
            </svg>
          </div>
        }
      </div>
      <p class="scanner__hint">Apuntá la cámara al código QR del pasaje.</p>
    }

    <canvas #canvas class="scanner__canvas" aria-hidden="true"></canvas>
  </div>
</div>
