<div class="drawer" [class.drawer--open]="open()">
  <!-- Gray layer: tapping it closes the menu -->
  <div class="drawer__scrim" (click)="close()"></div>

  <nav
    class="drawer__panel"
    id="main-menu"
    aria-label="Menú principal"
    [attr.inert]="open() ? null : ''"
  >
    <p class="drawer__brand">Ya llegó</p>

    <ul class="drawer__nav">
      <li>
        <a
          class="drawer__item"
          routerLink="/home"
          routerLinkActive="drawer__item--active"
          (click)="close()"
        >
          <svg class="drawer__mark" width="10" height="7" viewBox="0 0 10 7" fill="none" aria-hidden="true">
            <path d="M0.5 1h9M2 3.5h6M3.5 6h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          Inicio
        </a>
      </li>

      <li>
        <a
          class="drawer__item"
          routerLink="/profile"
          routerLinkActive="drawer__item--active"
          (click)="close()"
        >
          <svg class="drawer__mark" width="10" height="7" viewBox="0 0 10 7" fill="none" aria-hidden="true">
            <path d="M0.5 1h9M2 3.5h6M3.5 6h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          Ver perfil
        </a>
      </li>

      <!-- Administrators only: the route is also protected by rolesOnly. -->
      @if (isAdmin()) {
        <li>
          <a
            class="drawer__item"
            routerLink="/dashboard"
            routerLinkActive="drawer__item--active"
            (click)="close()"
          >
            <svg class="drawer__mark" width="10" height="7" viewBox="0 0 10 7" fill="none" aria-hidden="true">
              <path d="M0.5 1h9M2 3.5h6M3.5 6h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            </svg>
            Dashboard
          </a>
        </li>
      }
    </ul>

    <button class="drawer__logout" type="button" (click)="logout()">Cerrar sesión</button>
  </nav>
</div>
